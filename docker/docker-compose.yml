services:
  # Site app development (home + docs + playgrounds)
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    ports:
      - "3000:3000"   # Site app (/, /docs/*, /playground/*)
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    command: pnpm --filter site dev

  # Run tests
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    volumes:
      - ..:/app
      - /app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      - NODE_ENV=test
    command: pnpm test

  # Build all packages
  build:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    volumes:
      - ../packages/core/dist:/app/packages/core/dist
      - ../packages/react/dist:/app/packages/react/dist
      - ../packages/vue/dist:/app/packages/vue/dist
      - ../packages/svelte/dist:/app/packages/svelte/dist
      - ../packages/cli/dist:/app/packages/cli/dist
    command: pnpm build

  # Site app (production preview)
  docs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  pnpm-store:
